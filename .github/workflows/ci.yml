name: CI
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atentis_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: atentis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atentis_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet build -c Release
      - name: Тесты службы (включая интеграционные с PostgreSQL) и панели (окно рисуется без экрана)
        run: dotnet test -c Release --no-build
        env:
          ATENTIS_TEST_PG: Host=localhost;Database=atentis_test;Username=atentis_test;Password=ci_only_password
      - name: Известные уязвимости зависимостей
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: PowerShell-скрипты и установщик должны быть в UTF-8 с BOM (иначе Windows PowerShell 5.1 и Inno Setup ломают кириллицу)
        shell: pwsh
        run: |
          $files = Get-ChildItem deploy, installer -Include *.ps1, *.iss -Recurse
          $bad = $files | Where-Object { $b = [IO.File]::ReadAllBytes($_.FullName); -not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) }
          if ($bad) { $bad | ForEach-Object { Write-Error "Нет BOM: $($_.FullName)" }; exit 1 }
      - run: dotnet test -c Release
      - name: Сборка службы, панели и установщика
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          ./deploy/publish.ps1
      - name: Проверка установщика на настоящем Windows (установка, настройка на лету, авария, удаление)
        shell: pwsh
        run: |
          $installer = Get-ChildItem publish/installer -Filter 'AtentisServer-Setup-*.exe' | Select-Object -First 1
          ./installer/Test-Installation.ps1 -InstallerPath $installer.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AtentisServer-Setup
          path: publish/installer/*.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AtentisServer-Setup
          path: installer
      - name: Опубликовать релиз с установщиком
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Релиз мог быть уже создан кнопкой на сайте GitHub (тогда тег появился вместе с ним) - тогда просто прикладываем установщик.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" installer/*.exe --repo "$REPO" --clobber
          else
            gh release create "$TAG" installer/*.exe --repo "$REPO" --title "Atentis Server $TAG" --generate-notes
          fi
