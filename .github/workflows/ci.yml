name: CI
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atentis_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: atentis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atentis_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet build -c Release
      - name: Tests (включая интеграционные с PostgreSQL)
        run: dotnet test -c Release --no-build
        env:
          ATENTIS_TEST_PG: Host=localhost;Database=atentis_test;Username=atentis_test;Password=ci_only_password
      - name: Известные уязвимости зависимостей
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet test -c Release
      - name: Публикация win-x64
        run: ./deploy/publish.ps1 -Output ./publish/AtentisServer
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: AtentisServer-win-x64
          path: publish/AtentisServer
