# Стенд мониторинга: Prometheus + Grafana (+ Loki для логов). Запускать на ОТДЕЛЬНОМ сервере/ВМ, не на сервере с сервисом сбора.
#   docker compose up -d      -> Grafana: http://localhost:3000
# Пароли задаются переменными окружения или файлом .env (в git не коммитится).
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Задайте GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      ATENTIS_PG_HOST: ${ATENTIS_PG_HOST:?Задайте ATENTIS_PG_HOST (host:port)}
      ATENTIS_PG_READER_PASSWORD: ${ATENTIS_PG_READER_PASSWORD:?Задайте пароль роли atentis_reader}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes: [loki-data:/loki]
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
